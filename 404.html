// Redirect semua URL yang diawali /bts-stand ke Play Store.
// GitHub Pages tidak punya redirect server-side, jadi deep link
// seperti /bts-stand/song/:id dan /bts-stand/member/:nama jatuh ke 404.html.
// Script ini memindahkan user secara instan via location.replace().
(function () {
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.enhypen.lyrics";
  var path = window.location.pathname || "";
  if (path === "/bts-stand" || path.indexOf("/bts-stand/") === 0) {
    window.location.replace(PLAY_URL);
  }
})();
